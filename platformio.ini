[platformio]
default_envs = m5stack-cores3-hello

[env:m5stack-cores3]
platform = espressif32 @ 6.12.0
board = m5stack-cores3
framework = arduino
build_src_filter = +<*> -<hello_world.cpp>
upload_speed = 1500000
monitor_speed = 115200
; CoreS3 uses Quad PSRAM (not Octal PSRAM).
board_build.arduino.memory_type = qio_qspi
board_build.f_flash = 80000000L
board_build.filesystem = spiffs
board_build.partitions = default_16MB.csv
build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; 1=native 720p, 2=640x360 enlarged, 4=320x180 enlarged.
    -DAVATAR_HDMI_SCALE=1
lib_deps =
    m5stack/M5GFX @ 0.2.32
    m5stack/M5Unified @ 0.2.26
    https://github.com/mongonta0716/M5Unified-Avatar.git#69e8045bf98f49509611563b9d16ea433c7b8ea7

lib_ldf_mode = deep
extra_scripts = post:scripts/copy_firmware.py

; Standalone HDMI text test; no Avatar or additional I2C diagnostics.
[env:m5stack-cores3-hello]
extends = env:m5stack-cores3
build_src_filter = -<*> +<hello_world.cpp>
build_flags = -DCORE_DEBUG_LEVEL=3
lib_deps =
    m5stack/M5GFX @ 0.2.32
