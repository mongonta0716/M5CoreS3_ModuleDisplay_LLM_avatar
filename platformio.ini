[platformio]
default_envs = m5stack-cores3

[env:m5stack-cores3]
platform = espressif32 @ 6.12.0
board = m5stack-cores3
framework = arduino
build_src_filter = -<*> +<hello_world.cpp> +<DualDisplayAvatar.cpp>
upload_speed = 1500000
monitor_speed = 115200
; CoreS3 uses Quad PSRAM (not Octal PSRAM).
board_build.arduino.memory_type = qio_qspi
board_build.f_flash = 80000000L
board_build.filesystem = spiffs
board_build.partitions = default_16MB.csv
; No runtime filesystem assets: do not invoke Intel-only mkspiffs on macOS ARM.
custom_bundle_filesystem = no
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DHDMI_SOFTWARE_I2C
    -DHELLO_THEN_AVATAR
    -DUSE_MODULEDISPLAY=1
    ; 1=native 720p, 2=640x360 enlarged, 4=320x180 enlarged.
    -DAVATAR_HDMI_SCALE=4
lib_deps =
    ; 0.2.33 includes the ModuleDisplay transmitter ACK fix (#339).
    m5stack/M5GFX @ 0.2.33
    m5stack/M5Unified @ 0.2.26
    https://github.com/mongonta0716/M5Unified-Avatar.git#e92d62012a015511567e8ae76f042428e018a6d8

lib_ldf_mode = deep
extra_scripts = post:scripts/copy_firmware.py

; Compatibility alias for the current Avatar application.
[env:m5stack-cores3-hello]
extends = env:m5stack-cores3

; CoreS3 microphone plus ModuleDisplay video/audio.
[env:m5stack-cores3-display]
extends = env:m5stack-cores3
build_flags =
    ${env:m5stack-cores3.build_flags}
    -DUSE_MODULEDISPLAY=1

; ModuleLLM microphone/DSP/UART backend, keeping the local baseline as default.
[env:m5stack-cores3-modulellm-vowel]
extends = env:m5stack-cores3
build_flags =
    ${env:m5stack-cores3.build_flags}
    -DUSE_MODULELLM=1
    ; Official ModuleLLM CoreS3 example: RX=18, TX=17 (CoreS3 perspective).
    -DMODULELLM_UART_RX=18
    -DMODULELLM_UART_TX=17

; ModuleLLM microphone plus ModuleDisplay video/audio.
[env:m5stack-cores3-modulellm-display]
extends = env:m5stack-cores3-modulellm-vowel
build_flags =
    ${env:m5stack-cores3-modulellm-vowel.build_flags}
    -DUSE_MODULEDISPLAY=1

; Original hardware-I2C diagnostic app; also has no filesystem assets.
[env:m5stack-cores3-legacy]
extends = env:m5stack-cores3
build_src_filter = +<*> -<hello_world.cpp> -<DualDisplayAvatar.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DAVATAR_HDMI_SCALE=1
lib_deps =
    m5stack/M5GFX @ 0.2.32
    m5stack/M5Unified @ 0.2.26
    https://github.com/mongonta0716/M5Unified-Avatar.git#69e8045bf98f49509611563b9d16ea433c7b8ea7

; Explicit investigation build; keep extra I2C probes out of the default test.
[env:m5stack-cores3-hdmi-diag]
extends = env:m5stack-cores3-hello
build_src_filter = -<*> +<hello_world.cpp> +<HdmiDiagnostics.cpp>
build_flags = -DCORE_DEBUG_LEVEL=4 -DHDMI_READBACK_DIAGNOSTICS -DUSE_MODULEDISPLAY=1

[env:m5stack-cores3-hdmi-hw]
extends = env:m5stack-cores3-hello
build_flags = -DCORE_DEBUG_LEVEL=4 -DUSE_MODULEDISPLAY=1
