# Copied to /etc/default/modulellm-vowel; existing files are not overwritten.
UART_DEVICE=/dev/ttyS1
MIC_DEVICE=hw:0,0
# Verified hw:0,0 is S16_LE stereo at 16000 Hz. The right channel has a
# stronger signal on the inspected board; inspect both on a different board.
MIC_CHANNEL=right
MODEL_FILE=/var/lib/modulellm-vowel/model.txt
